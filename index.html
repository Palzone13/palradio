<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pal Labs Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:dark;--bg:#050505;--dots:#1a1a1a;--card:#101010;--text:#f2f2f2;--muted:#f2f2f299;--line:#ffffff1f;
  --y1:#2e2e2e;--y2:#161616;--edge:#000;--ink:#f2f2f2;--lcd:#08160a;--lcd-ink:#5dff7a;--ptt:#ff4d42;--ptt-d:#a82a21;--ok:#2fb344}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100dvh;background:var(--bg) radial-gradient(var(--dots) 1.5px,transparent 1.6px) 0 0/22px 22px;color:var(--text);
  font-family:"Bricolage Grotesque",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #6a4cff;outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;max-width:960px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:9px;background:var(--ink);position:relative}
.mark::before,.mark::after{content:"";position:absolute;left:7px;right:7px;height:3px;border-radius:2px;background:var(--y2)}
.mark::before{top:9px}.mark::after{top:17px;right:12px}
.pill{font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);display:flex;gap:7px;align-items:center}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:#999}
.pill.ok::before{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.pill.bad::before{background:var(--ptt)}
.stage{display:grid;grid-template-columns:min(420px,100%) 1fr;gap:32px;max-width:960px;margin:0 auto;padding:70px 20px 48px;align-items:start}
.side{display:grid;gap:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px 20px}
.card h2{margin:0 0 12px;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center}
.card h2 small{font-weight:400;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;align-items:center;gap:12px}
.list .empty{color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#1c1f4d;flex:none}
.list .t{margin-left:auto;color:var(--muted);font-size:.85rem}

/* radio device */
.device{position:relative;background:linear-gradient(160deg,var(--y1),var(--y2));border:3px solid #3a3a3a;border-radius:40px 40px 32px 32px;
  padding:0 22px 26px;color:var(--ink);box-shadow:0 12px 0 #000,0 30px 50px rgba(0,0,0,.9);display:flex;flex-direction:column;gap:16px}
.antenna{position:absolute;top:-62px;right:48px;width:22px;height:66px;background:linear-gradient(90deg,#4a4a4a,#222);border-radius:11px 11px 0 0}
.grille{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;padding:26px 8px 2px}
.grille i{height:7px;border-radius:4px;background:#fff;opacity:.2}
.screen{background:var(--lcd);color:var(--lcd-ink);border:3px solid #3a3a3a;border-radius:16px;padding:12px 16px 10px;
  box-shadow:inset 0 4px 14px rgba(0,0,0,.8),0 0 18px #5dff7a14;font-family:"VT323",monospace;transition:background .2s}
.device[data-mode=off] .screen{background:#0c100c;color:#2d4a31;box-shadow:inset 0 4px 14px #000}
.device[data-mode=tx] .screen{background:#1a0907;color:#ff6a5c;box-shadow:inset 0 4px 14px #000,0 0 22px #ff4d4233}
.s-top{display:flex;align-items:center;gap:12px}
.chnum{font-size:4rem;line-height:.9}
.chlabel{font-size:1.4rem;align-self:flex-end;padding-bottom:6px}
.sig{display:flex;align-items:flex-end;gap:3px;height:22px;margin-left:auto}
.sig i{width:5px;background:currentColor;opacity:.25;border-radius:1px}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:11px}.sig i:nth-child(3){height:16px}.sig i:nth-child(4){height:22px}
.device:not([data-mode=off]) .sig i{opacity:.9}
.mode{font-size:1.5rem;min-width:56px;text-align:right}
.vu{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:8px 0 6px}
.vu i{height:12px;border-radius:2px;background:currentColor;opacity:.15}
.vu i.on{opacity:.95}
.s-bot{display:flex;justify-content:space-between;gap:10px;font-size:1.3rem;line-height:1.1;min-height:1.2em}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.chips button{height:38px;border-radius:10px;border:2px solid #444;background:#1f1f1f;color:var(--ink);font-weight:800}
.chips button[aria-pressed=true]{background:#f2f2f2;color:#000;border-color:#f2f2f2}
.row{display:flex;gap:10px;align-items:center}
.key{flex:1;height:48px;border-radius:24px;border:2px solid #4a4a4a;background:#222;color:var(--ink);font-weight:600;box-shadow:0 4px 0 #000}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #000}
.power{flex:1.4}
.power[aria-pressed=true]{background:var(--ok);color:#fff}
.name{width:100%;height:46px;border:2px solid #444;border-radius:12px;background:#0d0d0d;padding:0 14px;color:var(--ink)}
.bay{display:grid;place-items:center;padding:14px 0 8px;background:#000;border-radius:24px;box-shadow:inset 0 3px 10px rgba(0,0,0,.9)}
.ptt{position:relative;width:min(190px,52vw);aspect-ratio:1;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff8a80,var(--ptt) 55%);
  color:#fff;font-weight:800;font-size:1.3rem;box-shadow:0 10px 0 var(--ptt-d),0 16px 22px rgba(0,0,0,.35);touch-action:none;user-select:none;-webkit-user-select:none;
  transition:transform .06s,box-shadow .06s}
.ptt::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--ptt);opacity:0}
.ptt.live{transform:translateY(8px);box-shadow:0 2px 0 var(--ptt-d),0 6px 10px rgba(0,0,0,.35)}
.ptt.live::after{animation:ring 1s ease-out infinite}
@keyframes ring{from{opacity:.8;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.ptt:disabled{background:#3a1f1c;box-shadow:0 10px 0 #1f0f0d;cursor:not-allowed;color:#ffffff66}
.hint{margin:0;text-align:center;font-size:.85rem;opacity:.8}
.tabs{display:none}

@media (max-width:820px){
  .top{padding-bottom:10px}
  .stage{display:block;padding:0}
  .side{display:block;padding:0 14px 100px}
  .card{margin-bottom:14px}
  .device{border-radius:0 0 36px 36px;margin-top:0;padding-top:4px;border-width:0 0 3px;box-shadow:0 8px 0 #000;gap:14px;
    min-height:calc(100dvh - 140px - env(safe-area-inset-bottom))}
  .antenna,.grille{display:none}
  .chnum{font-size:4.6rem}
  .bay{flex:1;min-height:230px}
  .ptt{width:min(230px,62vw)}
  .hint{display:none}
  body[data-tab=radio] .side{display:none}
  body[data-tab=crew] .device,body[data-tab=crew] #calls,body[data-tab=calls] .device,body[data-tab=calls] #crew{display:none}
  body[data-tab=crew] .side,body[data-tab=calls] .side{padding-top:6px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1.5px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{background:none;border:0;padding:8px 0;border-radius:12px;font-weight:600;color:var(--muted);display:grid;gap:2px;justify-items:center;font-size:.8rem}
  .tabs button[aria-selected=true]{color:var(--text);background:var(--line)}
  .tabs b{font-size:1.2rem;line-height:1}
}
@media (max-width:380px){.chips{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){.ptt,.ptt::after{transition:none;animation:none!important}}
</style>
</head>
<body data-tab="radio">

<header class="top">
  <div class="brand"><span class="mark"></span>Pal Labs Radio</div>
  <div class="pill" id="conn">Offline</div>
</header>

<div class="stage">
  <main class="device" id="device" data-mode="off">
    <div class="antenna"></div>
    <div class="grille" aria-hidden="true"></div>

    <div class="screen" aria-live="polite">
      <div class="s-top">
        <span class="chlabel">CH</span><span class="chnum" id="ch">01</span>
        <span class="sig" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="mode" id="state">OFF</span>
      </div>
      <div class="vu" id="vu" aria-hidden="true"></div>
      <div class="s-bot"><span id="status">Press power to start</span><span id="who"></span></div>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Channels"></div>

    <div class="row">
      <button class="key" id="prev" aria-label="Previous channel">Ch −</button>
      <button class="key power" id="power" aria-pressed="false">Power on</button>
      <button class="key" id="next" aria-label="Next channel">Ch +</button>
    </div>

    <div class="bay"><button class="ptt" id="ptt" disabled>Hold to talk</button></div>

    <input class="name" id="callsign" maxlength="16" placeholder="Your callsign" aria-label="Your callsign">
    <p class="hint">Space bar works too. Clips run up to 15 seconds.</p>
  </main>

  <aside class="side">
    <section class="card" id="crew"><h2>On this channel <small id="count"></small></h2><ul class="list" id="roster"><li class="empty">Nobody yet. Power on to join.</li></ul></section>
    <section class="card" id="calls"><h2>Recent calls</h2><ul class="list" id="log"><li class="empty">Nothing heard yet.</li></ul></section>
  </aside>
</div>

<nav class="tabs" aria-label="Sections">
  <button data-tab="radio" aria-selected="true"><b>📻</b>Radio</button>
  <button data-tab="crew" aria-selected="false"><b>👥</b>Crew</button>
  <button data-tab="calls" aria-selected="false"><b>🕘</b>Calls</button>
</nav>

<script>
const SUPABASE_URL = "https://rggwinuwwlwusianmdsv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJnZ3dpbnV3d2x3dXNpYW5tZHN2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2Mjg2MDEsImV4cCI6MjExMTIwNDYwMX0.JoLtu9dSsJI5mdwNvjVm34DOJR2lwnGHjyiBJb2lWqk";

const MAX_MS = 15000, MIN_MS = 350, CHANNELS = 8;
const $ = id => document.getElementById(id);
const myId = Math.random().toString(36).slice(2, 10);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let channel = null, ch = 1, on = false, stream = null, rec = null, chunks = [], recStart = 0, recTimer = null, talking = false;
let audioCtx = null, analyser = null, meterTimer = null;
const playQueue = []; let playing = false;

// ---- UI helpers ----
for (let i = 0; i < 10; i++) document.querySelector(".grille").appendChild(document.createElement("i"));
for (let i = 0; i < 16; i++) $("vu").appendChild(document.createElement("i"));
for (let i = 1; i <= CHANNELS; i++) {
  const b = document.createElement("button"); b.textContent = i; b.setAttribute("aria-label", "Channel " + i);
  b.setAttribute("aria-pressed", i === 1); b.onclick = () => setChannel(i); $("chips").appendChild(b);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.body.dataset.tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  window.scrollTo(0, 0);
});
try { $("callsign").value = localStorage.getItem("pl_name") || ""; } catch (e) {}
$("callsign").value = $("callsign").value || "Pal" + Math.floor(100 + Math.random() * 900);

const name = () => ($("callsign").value.trim() || "Pal").slice(0, 16);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function mode(m, text, status) { $("device").dataset.mode = m; $("state").textContent = text; if (status !== undefined) $("status").textContent = status; }
function conn(text, cls) { $("conn").textContent = text; $("conn").className = "pill " + (cls || ""); }
function meter(l) { const n = Math.round(l * 16); [...$("vu").children].forEach((s, i) => s.classList.toggle("on", i < n)); }
function avatar(n) {
  const h = [...n].reduce((a, c) => a + c.charCodeAt(0), 0) * 37 % 360;
  return `<span class="av" style="background:hsl(${h} 85% 78%)">${esc(n[0] || "?").toUpperCase()}</span>`;
}
function getCtx() { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
function beep(freq, ms, delay = 0) {
  try {
    const c = getCtx(), o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq; o.type = "square"; g.gain.value = .05; o.connect(g); g.connect(c.destination);
    const t = c.currentTime + delay; o.start(t); o.stop(t + ms / 1000);
  } catch (e) {}
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// ---- Channel + power ----
function setChannel(n) {
  ch = n; $("ch").textContent = String(n).padStart(2, "0");
  [...$("chips").children].forEach((b, i) => b.setAttribute("aria-pressed", i + 1 === n));
  if (on) join();
}
$("prev").onclick = () => setChannel(ch === 1 ? CHANNELS : ch - 1);
$("next").onclick = () => setChannel(ch === CHANNELS ? 1 : ch + 1);

async function join() {
  if (channel) { await sb.removeChannel(channel); channel = null; }
  $("ptt").disabled = true; conn("Connecting…"); mode("idle", "TUNE", "Tuning in…");
  channel = sb.channel("pal-radio-" + ch, { config: { broadcast: { self: false }, presence: { key: myId } } });
  channel.on("broadcast", { event: "voice" }, ({ payload }) => receive(payload));
  channel.on("presence", { event: "sync" }, () => {
    const st = channel.presenceState();
    const people = Object.entries(st).map(([k, v]) => ({ n: (v[0] && v[0].name) || "Pal", me: k === myId }));
    $("roster").innerHTML = people.map(p => `<li>${avatar(p.n)}<span>${esc(p.n)}${p.me ? " (you)" : ""}</span></li>`).join("") || '<li class="empty">Nobody yet.</li>';
    $("count").textContent = people.length + " online"; $("who").textContent = people.length + " on";
  });
  channel.subscribe(async status => {
    if (status === "SUBSCRIBED") {
      await channel.track({ name: name() });
      conn("Connected", "ok"); mode("idle", "READY", "Channel " + ch + " is open"); $("ptt").disabled = false;
    } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
      conn("Error", "bad"); mode("off", "ERROR", "Can’t connect. Check Realtime is enabled."); $("ptt").disabled = true;
    }
  });
}

$("power").onclick = async () => {
  if (!on) {
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { mode("idle", "NO MIC", "Allow the mic to talk. Listening still works."); }
    on = true; $("power").textContent = "Power off"; $("power").setAttribute("aria-pressed", true);
    beep(880, 90); beep(1320, 90, .1);
    try { localStorage.setItem("pl_name", name()); } catch (e) {}
    await join();
  } else {
    on = false; $("power").textContent = "Power on"; $("power").setAttribute("aria-pressed", false); $("ptt").disabled = true;
    if (channel) { await sb.removeChannel(channel); channel = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; analyser = null; }
    conn("Offline"); mode("off", "OFF", "Radio is off"); $("who").textContent = ""; meter(0);
    $("roster").innerHTML = '<li class="empty">Nobody yet. Power on to join.</li>'; $("count").textContent = "";
  }
};

// ---- Transmit ----
function startTx() {
  if (!on || talking || !channel || !stream || playing) return;
  const mt = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
  try { rec = new MediaRecorder(stream, mt ? { mimeType: mt, audioBitsPerSecond: 24000 } : { audioBitsPerSecond: 24000 }); }
  catch (e) { mode("idle", "ERROR", "This browser can’t record audio."); return; }
  chunks = []; talking = true; recStart = Date.now();
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = sendClip; rec.start();
  $("ptt").classList.add("live"); $("ptt").textContent = "Talking…"; mode("tx", "TX", "Transmitting…"); beep(1000, 60); buzz(25);
  const c = getCtx();
  if (!analyser) { analyser = c.createAnalyser(); analyser.fftSize = 256; c.createMediaStreamSource(stream).connect(analyser); }
  const d = new Uint8Array(analyser.fftSize);
  meterTimer = setInterval(() => { analyser.getByteTimeDomainData(d); let m = 0; for (const v of d) m = Math.max(m, Math.abs(v - 128)); meter(Math.min(1, m / 60)); }, 60);
  recTimer = setTimeout(stopTx, MAX_MS);
}
function stopTx() {
  if (!talking) return;
  talking = false; clearTimeout(recTimer); clearInterval(meterTimer); meter(0);
  $("ptt").classList.remove("live"); $("ptt").textContent = "Hold to talk";
  try { rec.stop(); } catch (e) {}
}
function sendClip() {
  const ms = Date.now() - recStart;
  mode("idle", "READY", "Channel " + ch + " is open");
  if (ms < MIN_MS || !chunks.length) { $("status").textContent = "Too short. Hold while you talk."; return; }
  const type = rec.mimeType || "audio/webm", fr = new FileReader();
  fr.onload = async () => {
    const res = await channel.send({ type: "broadcast", event: "voice", payload: { from: myId, name: name(), audio: String(fr.result).split(",")[1], mime: type, ms } });
    beep(700, 70);
    if (res === "ok") addLog("You", ms); else $("status").textContent = "Didn’t send. Try again.";
  };
  fr.readAsDataURL(new Blob(chunks, { type }));
}

// ---- Receive ----
function receive(p) { if (p && p.audio) { playQueue.push(p); if (!playing) playNext(); } }
function playNext() {
  const p = playQueue.shift();
  if (!p) { playing = false; clearInterval(meterTimer); meter(0); if (on) mode("idle", "READY", "Channel " + ch + " is open"); return; }
  playing = true; mode("rx", "RX", (p.name || "Pal") + " is talking"); beep(1200, 60); buzz(20);
  clearInterval(meterTimer); meterTimer = setInterval(() => meter(.25 + Math.random() * .7), 90);
  const a = new Audio("data:" + p.mime + ";base64," + p.audio);
  a.onended = () => { beep(900, 70); addLog(p.name || "Pal", p.ms); playNext(); };
  a.onerror = () => playNext();
  a.play().catch(() => { $("status").textContent = "Tap the page to enable sound"; playNext(); });
}
function addLog(who, ms) {
  const ul = $("log"); if (ul.querySelector(".empty")) ul.innerHTML = "";
  const li = document.createElement("li");
  li.innerHTML = avatar(who) + `<span>${esc(who)}</span><span class="t">${(ms / 1000).toFixed(1)}s · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}</span>`;
  ul.prepend(li); while (ul.children.length > 8) ul.lastChild.remove();
}

// ---- Push to talk inputs ----
const btn = $("ptt");
btn.addEventListener("pointerdown", e => { e.preventDefault(); btn.setPointerCapture(e.pointerId); startTx(); });
btn.addEventListener("pointerup", stopTx);
btn.addEventListener("pointercancel", stopTx);
btn.addEventListener("contextmenu", e => e.preventDefault());
window.addEventListener("keydown", e => { if (e.code === "Space" && !e.repeat && document.activeElement.tagName !== "INPUT") { e.preventDefault(); startTx(); } });
window.addEventListener("keyup", e => { if (e.code === "Space") stopTx(); });
</script>
</body>
</html>
